name: PrismRV-CI

on:
  workflow_dispatch:
  push:
    branches: [prismrv-oxalpha]
    paths:
      - 'src/gallium/drivers/prismrv/**'
      - 'src/gallium/meson.build'
      - 'meson.options'
      - '.github/workflows/prismrv.yml'
  pull_request:
    branches: [prismrv-oxalpha]
    paths:
      - 'src/gallium/drivers/prismrv/**'

permissions:
  contents: read

concurrency:
  group: prismrv-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meson-build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bison flex ninja-build pkg-config \
          libdrm-dev libexpat1-dev zlib1g-dev \
        && python3 -m pip install mako meson pyyaml ply

    - name: Configure (prismrv only, minimal)
      run: |
        meson setup build \
          -Dgallium-drivers=prismrv \
          -Dgallium-extra-hud=false \
          -Dvulkan-drivers=[] \
          -Dglx=disabled \
          -Dplatforms=[] \
          -Degl=disabled \
          -Dgbm=disabled \
          -Dopengl=true \
          -Dgles1=disabled \
          -Dgles2=disabled \
          -Dllvm=disabled \
          -Dshared-glapi=enabled \
          -Dtools=drm-shim \
          -Dbuild-tests=true

    - name: Build
      run: ninja -C build

    - name: NIR to USSE Test
      run: |
        meson test -C build prismrv-nir --print-errorlogs || \
        echo "::warning::NIR test needs full NIR dependency resolution"

    - name: Run prismrv NIR test
      run: meson test -C build prismrv-nir --print-errorlogs

  syntax-only:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Syntax check (clang -fsyntax-only)
      run: |
        for f in src/gallium/drivers/prismrv/*.c; do
          clang -fsyntax-only -std=c11 \
            -DHAVE_ENDIAN_H -DHAVE_PTHREAD -DHAVE_STRUCT_TIMESPEC \
            -D_GNU_SOURCE -DNDEBUG \
            -Isrc/gallium/include -Isrc/gallium/auxiliary \
            -Isrc/compiler/nir/generated -Isrc/compiler/generated \
            -Isrc -Isrc/compiler/nir -Isrc/compiler -Isrc/util -Iinclude \
            "$f" || exit 1
        done

  # Cross-compile the driver for the real hardware target:
  # Lenovo Yoga Tablet 8 B8000-F (MT6589, ARMv7 Cortex-A9 + NEON, SGX544 GPU).
  # Produces a drop-in tarball (gallium_dri.so mega-driver incl. prismrv,
  # libEGL, libglapi) and publishes it to GitHub Releases.
  armhf-release:
    runs-on: ubuntu-22.04
    needs: [meson-build, syntax-only]
    permissions:
      contents: write
    env:
      CROSS_TRIPLET: arm-linux-gnueabihf
    steps:
    - uses: actions/checkout@v4

    - name: Install native + cross (armhf) dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          bison flex ninja-build pkg-config \
          gcc-arm-linux-gnueabihf g++-arm-linux-gnueabihf
        python3 -m pip install mako meson pyyaml ply

    # Build a private armhf sysroot WITHOUT touching the host's apt state:
    # an isolated sources list lets `apt-get download` fetch the exact jammy
    # armhf debs (libdrm 2.4.110 satisfies mesa's >= 2.4.109), and we unpack
    # them by hand. Zero dependency resolution, nothing multiarch-installed.
    - name: Assemble armhf sysroot from Ubuntu Ports debs
      run: |
        set -euxo pipefail
        mkdir -p /tmp/armhf-apt/lists/partial /tmp/armhf-apt/cache/archives/partial \
                 /opt/sysroot-armhf
        : > /tmp/armhf-apt/status
        echo "deb [arch=armhf] https://ports.ubuntu.com/ubuntu-ports jammy main" > /tmp/armhf-apt/sources.list
        sudo apt-get update \
          -o Dir::Etc::sourcelist=/tmp/armhf-apt/sources.list \
          -o Dir::Etc::sourceparts=/dev/null \
          -o Dir::State::lists=/tmp/armhf-apt/lists \
          -o Dir::Cache=/tmp/armhf-apt/cache \
          -o Dir::State::status=/tmp/armhf-apt/status
        cd /tmp/armhf-apt
        for p in libdrm2 libdrm-dev libdrm-nouveau2 libdrm-radeon1 libdrm-amdgpu1 zlib1g zlib1g-dev; do
          apt-get download "$p" \
            -o APT::Architecture=armhf \
            -o APT::Architectures=armhf \
            -o Dir::Etc::sourcelist=/tmp/armhf-apt/sources.list \
            -o Dir::Etc::sourceparts=/dev/null \
            -o Dir::State::lists=/tmp/armhf-apt/lists \
            -o Dir::Cache=/tmp/armhf-apt/cache \
            -o Dir::State::status=/tmp/armhf-apt/status
        done
        for deb in *.deb; do dpkg-deb -x "$deb" /opt/sysroot-armhf; done
        ls /opt/sysroot-armhf/usr/lib/arm-linux-gnueabihf/pkgconfig/

    - name: Write cross file
      run: |
        cat > armhf.cross <<EOF
        [binaries]
        c = '${CROSS_TRIPLET}-gcc'
        cpp = '${CROSS_TRIPLET}-g++'
        ar = '${CROSS_TRIPLET}-ar'
        strip = '${CROSS_TRIPLET}-strip'
        nm = '${CROSS_TRIPLET}-nm'
        pkg-config = '${CROSS_TRIPLET}-pkg-config'

        [host_machine]
        system = 'linux'
        cpu_family = 'arm'
        cpu = 'armv7-a'
        endian = 'little'

        [properties]
        # Yoga Tablet 8 B8000-F: MT6589 = 4x Cortex-A9 + NEON, hard-float ABI.
        # The explicit -I is required: meson drops the sysroot-prefix include
        # coming from libdrm.pc, hiding /usr/include/xf86drm.h
        c_args = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=hard',
                  '-I/opt/sysroot-armhf/usr/include']
        cpp_args = ['-march=armv7-a', '-mfpu=neon', '-mfloat-abi=hard',
                    '-I/opt/sysroot-armhf/usr/include']

        [built-in options]
        c_link_args = ['-L/opt/sysroot-armhf/usr/lib/${CROSS_TRIPLET}', '-Wl,-rpath-link,/opt/sysroot-armhf/usr/lib/${CROSS_TRIPLET}']
        cpp_link_args = ['-L/opt/sysroot-armhf/usr/lib/${CROSS_TRIPLET}', '-Wl,-rpath-link,/opt/sysroot-armhf/usr/lib/${CROSS_TRIPLET}']
        EOF
        # Multiarch pkg-config wrapper: resolve .pc files inside the armhf
        # sysroot (SYSROOT_DIR rewrites the /usr prefix baked into the .pc)
        printf '#!/bin/sh\nPKG_CONFIG_LIBDIR="/opt/sysroot-armhf/usr/lib/%s/pkgconfig:/opt/sysroot-armhf/usr/share/pkgconfig" PKG_CONFIG_SYSROOT_DIR=/opt/sysroot-armhf exec pkg-config "$@"\n' "${CROSS_TRIPLET}" | \
          sudo tee /usr/local/bin/${CROSS_TRIPLET}-pkg-config > /dev/null
        sudo chmod +x /usr/local/bin/${CROSS_TRIPLET}-pkg-config

    - name: Configure cross build (prismrv + EGL)
      run: |
        meson setup build-arm \
          --cross-file armhf.cross \
          -Dgallium-drivers=prismrv \
          -Dgallium-extra-hud=false \
          -Dvulkan-drivers=[] \
          -Dglx=disabled \
          -Dplatforms=[] \
          -Degl=enabled \
          -Dgbm=disabled \
          -Dopengl=true \
          -Dgles1=disabled \
          -Dgles2=disabled \
          -Dllvm=disabled \
          -Dshared-glapi=enabled \
          -Dxmlconfig=disabled \
          -Dtools=[]

    - name: Build
      run: ninja -C build-arm

    - name: Stage install tree
      run: |
        meson install -C build-arm --destdir stage
        SHORT_SHA="${GITHUB_SHA::7}"
        {
          echo "PrismRV Mesa ${SHORT_SHA} (armhf)"
          echo ""
          echo "Target  : Lenovo Yoga Tablet 8 B8000-F (MT6589 / SGX544)"
          echo "ABI     : linux armv7-a + NEON, hard-float"
          echo "Source  : teamYogaBlade2/mesa @ prismrv-oxalpha, commit ${GITHUB_SHA}"
          echo "Options : gallium-drivers=prismrv, egl=enabled, glx/gbm/xmlconfig disabled"
          echo ""
          echo "Layout:"
          echo "  usr/lib/*/dri/prismrv_dri.so -> gallium_dri.so (mega driver)"
          echo "  usr/lib/*/libEGL_mesa.so.1, libglapi.so.0"
        } > stage/prismrv-mesa-README.txt
        find stage -type f -o -type l | sort

    - name: Pack tarball
      run: |
        SHORT_SHA="${GITHUB_SHA::7}"
        tar -C build-arm/stage -cJf "prismrv-mesa-${SHORT_SHA}-armhf.tar.xz" .
        ls -lh prismrv-mesa-*.tar.xz

    - name: Upload artifact (debug convenience)
      uses: actions/upload-artifact@v4
      with:
        name: prismrv-mesa-${{ github.sha }}-armhf
        path: prismrv-mesa-*-armhf.tar.xz
        retention-days: 14

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: prismrv-continuous-${{ github.sha }}
        name: PrismRV continuous ${{ github.sha }}
        body: |
          Continuous build of the PrismRV Gallium driver for
          Lenovo Yoga Tablet 8 B8000-F (MT6589, SGX544).

          - branch: prismrv-oxalpha
          - commit: ${{ github.sha }}
          - target: linux armv7-a hard-float (NEON)
          - contents: gallium_dri.so (prismrv), libEGL_mesa.so.1, libglapi.so.0
        files: prismrv-mesa-*-armhf.tar.xz
        prerelease: true
        make_latest: false
